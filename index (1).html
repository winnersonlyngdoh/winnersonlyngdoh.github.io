<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Winnerson Lyngdoh — Computer Science Engineer & Android Developer" />
  <title>Winnerson Lyngdoh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    :root {
      --coral:   #ff6b6b;
      --yellow:  #ffd93d;
      --green:   #6bcb77;
      --blue:    #4d96ff;
      --purple:  #c77dff;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body:    'Inter', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
    }
    [data-theme="dark"] {
      --bg:      #0f0e17;
      --bg2:     #1a1826;
      --border:  #2e2b3f;
      --text:    #fffffe;
      --muted:   #a7a9be;
      --card-bg: #1a1826;
      --nav-bg:  rgba(15,14,23,0.9);
    }
    [data-theme="light"] {
      --bg:      #f7f7ff;
      --bg2:     #eeeeff;
      --border:  #d0cfed;
      --text:    #0f0e17;
      --muted:   #5f5c80;
      --card-bg: #ffffff;
      --nav-bg:  rgba(247,247,255,0.9);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }
    a { color: inherit; text-decoration: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    @keyframes blob { 0%,100%{transform:scale(1) translate(0,0)} 50%{transform:scale(1.08) translate(10px,-10px)} }
    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(60px); pointer-events: none;
      animation: blob 8s ease-in-out infinite;
    }
    .cursor {
      display:inline-block; width:3px; height:1em;
      background:var(--yellow); margin-left:2px; vertical-align:middle;
      animation: blink 1s step-end infinite;
    }
    .section { padding: 5rem 0; border-bottom: 1px solid var(--border); }
    .container { max-width: 820px; margin: 0 auto; padding: 0 1.5rem; }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; align-items: center;
      justify-content: space-between; height: 60px;
    }
    .nav-logo { font-family: var(--font-mono); color: var(--coral); font-weight: 700; font-size: 0.9rem; }
    .nav-links { display: flex; align-items: center; gap: 1.5rem; }
    .nav-link {
      font-family: var(--font-mono); font-size: 0.78rem;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted); transition: color 0.2s;
    }
    .nav-link:hover { color: var(--coral); }
    .theme-btn {
      background: none; border: 2px solid var(--border);
      border-radius: 999px; cursor: pointer; padding: 5px 14px;
      font-size: 0.82rem; color: var(--text);
      font-family: var(--font-mono); transition: all 0.2s;
    }
    .theme-btn:hover { border-color: var(--coral); }
    header {
      padding: 7rem 0 5rem;
      border-bottom: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .hero-eyebrow { font-family: var(--font-mono); font-size: 0.82rem; color: var(--green); letter-spacing: 0.1em; margin-bottom: 1.2rem; }
    .hero-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 1.05; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--coral) 0%, var(--purple) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 1rem;
    }
    .hero-role {
      font-family: var(--font-mono);
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--text); margin-bottom: 2rem;
      min-height: 2em; display: flex; align-items: center; gap: 4px;
    }
    .hero-bio { font-size: 1rem; color: var(--muted); max-width: 580px; line-height: 1.8; margin-bottom: 2.5rem; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 0.65rem; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      color: var(--muted); font-size: 0.82rem;
      font-family: var(--font-mono); transition: all 0.2s;
    }
    .pill:hover { border-color: var(--coral); background: var(--coral); color: #fff; transform: translateY(-2px); }
    .section-label {
      display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2.5rem;
    }
    .section-label-bar { display: block; width: 32px; height: 3px; border-radius: 2px; }
    .section-label-text { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .card {
      background: var(--card-bg); border: 2px solid var(--border);
      border-radius: 16px; padding: 1.5rem 1.75rem;
      margin-bottom: 1rem; transition: all 0.25s ease;
    }
    .card:hover { transform: translateY(-4px); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 1rem; }
    .card-title { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
    .card-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
    .card-sub { font-size: 0.82rem; font-weight: 500; margin-bottom: 0.75rem; }
    .card-bullets { padding: 0; display: flex; flex-direction: column; gap: 0.35rem; }
    .card-bullet {
      list-style: none; font-size: 0.88rem; color: var(--muted);
      padding-left: 0.75rem; border-left: 2px solid;
    }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    .about-card {
      background: var(--card-bg); border: 2px solid var(--border);
      border-radius: 16px; padding: 1.5rem; transition: all 0.25s ease;
    }
    .about-card:hover { transform: translateY(-4px); }
    .about-emoji { font-size: 2rem; margin-bottom: 0.75rem; }
    .about-title { font-family: var(--font-display); font-weight: 700; margin-bottom: 0.4rem; }
    .about-text { font-size: 0.88rem; color: var(--muted); line-height: 1.65; }
    .edu-card {
      background: var(--card-bg); border: 2px solid var(--border);
      border-radius: 16px; padding: 2rem; position: relative; overflow: hidden;
    }
    .edu-bar { position: absolute; top: 0; left: 0; width: 4px; height: 100%; border-radius: 2px 0 0 2px; }
    .edu-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
    .edu-degree { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin-bottom: 0.3rem; }
    .edu-school { font-weight: 500; margin-bottom: 0.25rem; }
    .edu-loc { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
    .edu-badge { font-family: var(--font-mono); font-size: 0.78rem; padding: 4px 12px; border-radius: 999px; display: inline-block; margin-bottom: 0.5rem; }
    .edu-cgpa { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); }
    .skills-block { margin-bottom: 1.5rem; }
    .skills-block-label { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.65rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tag {
      padding: 5px 14px; border-radius: 999px;
      border: 2px solid; font-family: var(--font-mono);
      font-size: 0.78rem; transition: all 0.18s ease; cursor: default;
    }
    .tag:hover { color: var(--bg) !important; transform: translateY(-3px) scale(1.05); }
    .contact-box {
      background: var(--card-bg); border: 2px solid var(--border);
      border-radius: 20px; padding: 3rem 2rem; text-align: center;
    }
    .contact-emoji { font-size: 3rem; margin-bottom: 1rem; }
    .contact-title { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; margin-bottom: 0.75rem; }
    .contact-text { color: var(--muted); margin-bottom: 2rem; }
    footer { padding: 2rem 0; text-align: center; }
    footer p { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }

    @media (max-width: 600px) {
      .about-grid { grid-template-columns: 1fr; }
      .nav-links a[data-section] { display: none; }
      .hero-name { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const ROLES = ["Computer Science Engineer","Android Developer","Kotlin Enthusiast","Problem Solver","Lifelong Learner"];
const COLORS = ["var(--coral)","var(--yellow)","var(--green)","var(--blue)","var(--purple)"];

const ABOUT_CARDS = [
  { emoji:"🚀", color:"var(--coral)",  title:"Builder",      text:"I love turning ideas into working software — from Android apps to backend systems." },
  { emoji:"🧩", color:"var(--blue)",   title:"Problem Solver",text:"I approach every challenge analytically, breaking it into manageable pieces." },
  { emoji:"📚", color:"var(--green)",  title:"Learner",      text:"Passionate about emerging technologies and continuous self-improvement." },
  { emoji:"🤝", color:"var(--purple)", title:"Collaborator", text:"I thrive in team environments and value clear communication above all." },
];

const PROJECTS = [{
  title:"Flag Quiz App", date:"2023", tag:"Kotlin · Android", color:"var(--green)", emoji:"🏳️",
  bullets:[
    "Interactive Android quiz app testing knowledge of world flags with a dynamic UI.",
    "Implemented username auth, score calculation, question navigation & real-time results.",
    "Applied OOP principles & Android dev concepts to build responsive UI components.",
  ],
}];

const CERTS = [
  { title:"Android Development using Kotlin", issuer:"Extellon", date:"2023", color:"var(--blue)", emoji:"📱",
    bullets:["Practical Kotlin & Android dev with Java-based OOP concepts.","Built multiple apps covering UI design, lifecycle management & navigation.","Deepened skills in mobile architecture, debugging, and performance tuning."] },
  { title:"Knowledge Brainstorm", issuer:"Lovely Professional University", date:"2020", color:"var(--yellow)", emoji:"🏆",
    bullets:["State Topper Rank — 99.7 percentile among all participating candidates.","Recognized for exceptional aptitude and technical reasoning at the state level."] },
];

const SKILLS_TECH = ["Java","C++","Python","Kotlin","HTML","CSS","JavaScript","SQL","DBMS","RDBMS"];
const SKILLS_SOFT = ["Critical Thinking","Problem Solving","Time Management","Adaptability","Teamwork"];
const LANGS = ["English","Khasi","Pnar"];

function useTypewriter(words, speed = 80) {
  const [display, setDisplay] = useState("");
  const [wi, setWi] = useState(0);
  const [ci, setCi] = useState(0);
  const [del, setDel] = useState(false);
  useEffect(() => {
    const cur = words[wi];
    const delay = del ? 40 : ci === cur.length ? 1800 : speed;
    const t = setTimeout(() => {
      if (!del && ci < cur.length) { setDisplay(cur.slice(0, ci+1)); setCi(c=>c+1); }
      else if (!del) { setDel(true); }
      else if (del && ci > 0) { setDisplay(cur.slice(0, ci-1)); setCi(c=>c-1); }
      else { setDel(false); setWi(i=>(i+1)%words.length); }
    }, delay);
    return () => clearTimeout(t);
  }, [ci, del, wi]);
  return display;
}

function useReveal() {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold: 0.1 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

function Tag({ label, idx }) {
  const color = COLORS[idx % COLORS.length];
  const [h, setH] = useState(false);
  return (
    <span className="tag"
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ borderColor: color, color: h ? "var(--bg)" : color, background: h ? color : "transparent" }}>
      {label}
    </span>
  );
}

function Card({ item }) {
  const [ref, v] = useReveal();
  return (
    <div ref={ref} className="card"
      style={{ borderColor: "var(--border)", opacity: v ? 1 : 0, transform: v ? "translateY(0)" : "translateY(20px)", transition: "all 0.5s ease" }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = item.color; e.currentTarget.style.boxShadow = `0 8px 32px ${item.color}33`; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)"; e.currentTarget.style.boxShadow = "none"; }}>
      <div className="card-header">
        <span className="card-title">{item.emoji} {item.title}</span>
        <span className="card-date">{item.date}</span>
      </div>
      <p className="card-sub" style={{ color: item.color }}>{item.tag || item.issuer}</p>
      <ul className="card-bullets">
        {item.bullets.map((b,i) => (
          <li key={i} className="card-bullet" style={{ borderColor: item.color + "55" }}>{b}</li>
        ))}
      </ul>
    </div>
  );
}

function Pill({ href, icon, label }) {
  return (
    <a href={href} className="pill">{icon} {label}</a>
  );
}

function SLabel({ color, children }) {
  return (
    <div className="section-label">
      <span className="section-label-bar" style={{ background: color }} />
      <span className="section-label-text" style={{ color }}>{children}</span>
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState("dark");
  const role = useTypewriter(ROLES);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);

  return (
    <div>
      {/* Nav */}
      <nav>
        <div className="container nav-inner">
          <span className="nav-logo">{"<WL />"}</span>
          <div className="nav-links">
            {["about","education","projects","contact"].map(s => (
              <a key={s} href={`#${s}`} className="nav-link" data-section>{s}</a>
            ))}
            <button className="theme-btn" onClick={() => setTheme(t => t === "dark" ? "light" : "dark")}>
              {theme === "dark" ? "☀️ light" : "🌙 dark"}
            </button>
          </div>
        </div>
      </nav>

      {/* Hero */}
      <header>
        <div className="blob" style={{ top:"-80px", right:"-80px", width:"400px", height:"400px", background:"var(--coral)", opacity:0.07 }} />
        <div className="blob" style={{ bottom:"-60px", left:"-60px", width:"300px", height:"300px", background:"var(--blue)", opacity:0.07, animationDelay:"3s" }} />
        <div className="container" style={{ position:"relative", zIndex:1 }}>
          <p className="hero-eyebrow">👋 Hey there, I'm</p>
          <h1 className="hero-name">Winnerson<br/>Lyngdoh</h1>
          <div className="hero-role">
            <span>{role}</span>
            <span className="cursor" />
          </div>
          <p className="hero-bio">
            CS Engineer passionate about building impactful Android apps and solving real-world problems through clean, efficient code.
            Based in <span style={{ color:"var(--green)" }}>Shillong, India 🌄</span>.
          </p>
          <div className="pill-row">
            <Pill href="mailto:winnersonlyngdoh@gmail.com" icon="✉️" label="winnersonlyngdoh@gmail.com" />
            <Pill href="tel:+917005916120" icon="📞" label="+91 7005916120" />
            <Pill href="https://linkedin.com" icon="💼" label="LinkedIn" />
            <Pill href="#" icon="📍" label="Shillong, India" />
          </div>
        </div>
      </header>

      <main>
        {/* About */}
        <section id="about" className="section">
          <div className="container">
            <SLabel color="var(--coral)">about me</SLabel>
            <div className="about-grid">
              {ABOUT_CARDS.map(({ emoji, color, title, text }) => (
                <div key={title} className="about-card"
                  onMouseEnter={e => { e.currentTarget.style.borderColor = color; e.currentTarget.style.boxShadow = `0 8px 24px ${color}33`; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--border)"; e.currentTarget.style.boxShadow = "none"; }}>
                  <div className="about-emoji">{emoji}</div>
                  <h3 className="about-title" style={{ color }}>{title}</h3>
                  <p className="about-text">{text}</p>
                </div>
              ))}
            </div>
            <div style={{ background:"var(--card-bg)", border:"2px solid var(--border)", borderRadius:"16px", padding:"1.5rem 1.75rem" }}>
              <p style={{ color:"var(--muted)", lineHeight:1.8 }}>
                Innovative Computer Science Engineer with hands-on experience in software development, Android application
                development, and technical project execution. Proficient in Java, Kotlin, Python, SQL, and modern development
                tools, with strong foundations in OOP, database systems, and scalable application design.
              </p>
            </div>
          </div>
        </section>

        {/* Education */}
        <section id="education" className="section">
          <div className="container">
            <SLabel color="var(--yellow)">education</SLabel>
            <div className="edu-card">
              <div className="edu-bar" style={{ background:"var(--yellow)" }} />
              <div className="edu-inner">
                <div>
                  <p className="edu-degree">🎓 B.Tech in Computer Science Engineering</p>
                  <p className="edu-school" style={{ color:"var(--yellow)" }}>Lovely Professional University</p>
                  <p className="edu-loc">Phagwara, Punjab</p>
                </div>
                <div style={{ textAlign:"right" }}>
                  <span className="edu-badge" style={{ background:"var(--yellow)22", color:"var(--yellow)", border:"1px solid var(--yellow)44" }}>2020 – 2025</span>
                  <p className="edu-cgpa">CGPA: 7.03</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        {/* Projects & Certs */}
        <section id="projects" className="section">
          <div className="container">
            <SLabel color="var(--green)">projects</SLabel>
            {PROJECTS.map(p => <Card key={p.title} item={p} />)}

            <div style={{ marginTop:"3rem" }}>
              <SLabel color="var(--blue)">certifications & awards</SLabel>
              {CERTS.map(c => <Card key={c.title} item={c} />)}
            </div>

            <div style={{ marginTop:"3rem" }}>
              <SLabel color="var(--purple)">skills</SLabel>
              {[
                { label:"Technical",  tags: SKILLS_TECH },
                { label:"Soft Skills", tags: SKILLS_SOFT },
                { label:"Languages",  tags: LANGS },
              ].map(({ label, tags }) => (
                <div key={label} className="skills-block">
                  <p className="skills-block-label">{label}</p>
                  <div className="tags">
                    {tags.map((t,i) => <Tag key={t} label={t} idx={i} />)}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* Contact */}
        <section id="contact" className="section">
          <div className="container">
            <SLabel color="var(--coral)">contact</SLabel>
            <div className="contact-box">
              <div className="contact-emoji">💬</div>
              <h2 className="contact-title">Let's build something cool</h2>
              <p className="contact-text">Open to opportunities, collaborations, and interesting projects.</p>
              <div className="pill-row" style={{ justifyContent:"center" }}>
                <Pill href="mailto:winnersonlyngdoh@gmail.com" icon="✉️" label="winnersonlyngdoh@gmail.com" />
                <Pill href="https://linkedin.com" icon="💼" label="LinkedIn" />
                <Pill href="tel:+917005916120" icon="📞" label="+91 7005916120" />
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer>
        <div className="container">
          <p>Built with React · Hosted on GitHub Pages · © 2025 Winnerson Lyngdoh</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
