<!doctype html>
<html lang="en" data-theme="dark">

      content="Winnerson Lyngdoh — Computer Science Engineer & Android Developer"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

    <style>
      :root {
        --coral: #ff6b6b;
        --yellow: #ffd93d;
        --green: #6bcb77;
        --blue: #4d96ff;
        --purple: #c77dff;
        --font-display: "Space Grotesk", sans-serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      [data-theme="dark"] {
        --bg: #0f0e17;
        --bg2: #1a1826;
        --border: #2e2b3f;
        --text: #fffffe;
        --muted: #a7a9be;
        --card-bg: #1a1826;
        --nav-bg: rgba(15, 14, 23, 0.92);
        --shimmer: rgba(255, 255, 255, 0.04);
      }
      [data-theme="light"] {
        --bg: #f7f7ff;
        --bg2: #eeeeff;
        --border: #d0cfed;
        --text: #0f0e17;
        --muted: #5f5c80;
        --card-bg: #ffffff;
        --nav-bg: rgba(247, 247, 255, 0.92);
        --shimmer: rgba(255, 255, 255, 0.6);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        transition:
          background 0.35s,
          color 0.35s;
      }
      a {
        color: inherit;
        text-decoration: none;
      }

      /* ── Keyframes ── */
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      @keyframes blob {
        0%,
        100% {
          transform: scale(1) translate(0, 0);
        }
        50% {
          transform: scale(1.1) translate(12px, -12px);
        }
      }
      @keyframes floatUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 currentColor;
        }
        50% {
          box-shadow: 0 0 0 6px transparent;
        }
      }
      @keyframes bounceEmoji {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        30% {
          transform: translateY(-8px) rotate(-5deg);
        }
        60% {
          transform: translateY(-4px) rotate(3deg);
        }
      }

      /* ── Scroll-reveal base states ── */
      .reveal {
        opacity: 0;
        transform: translateY(36px);
        transition:
          opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .reveal.from-left {
        transform: translateX(-36px) translateY(0);
      }
      .reveal.from-right {
        transform: translateX(36px) translateY(0);
      }
      .reveal.pop {
        transform: scale(0.9);
      }
      .reveal.visible {
        opacity: 1;
        transform: none;
      }

      /* stagger children */
      .stagger > * {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .stagger.visible > *:nth-child(1) {
        opacity: 1;
        transform: none;
        transition-delay: 0.05s;
      }
      .stagger.visible > *:nth-child(2) {
        opacity: 1;
        transform: none;
        transition-delay: 0.15s;
      }
      .stagger.visible > *:nth-child(3) {
        opacity: 1;
        transform: none;
        transition-delay: 0.25s;
      }
      .stagger.visible > *:nth-child(4) {
        opacity: 1;
        transform: none;
        transition-delay: 0.35s;
      }

      /* ── Blob ── */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        animation: blob 9s ease-in-out infinite;
      }

      /* ── Nav ── */
      nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--nav-bg);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        transition: background 0.35s;
      }
      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
      }
      .nav-logo {
        font-family: var(--font-mono);
        color: var(--coral);
        font-weight: 700;
        font-size: 0.9rem;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }
      .nav-link {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        transition: color 0.2s;
      }
      .nav-link:hover {
        color: var(--coral);
      }
      .theme-btn {
        background: none;
        border: 2px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        padding: 5px 14px;
        font-size: 0.82rem;
        color: var(--text);
        font-family: var(--font-mono);
        transition: all 0.2s;
      }
      .theme-btn:hover {
        border-color: var(--coral);
        color: var(--coral);
      }

      /* ── Layout ── */
      .container {
        max-width: 820px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      .section {
        padding: 5rem 0;
        border-bottom: 1px solid var(--border);
      }

      /* ── Hero ── */
      header {
        padding: 7rem 0 5rem;
        border-bottom: 1px solid var(--border);
        position: relative;
        overflow: hidden;
      }
      .hero-eyebrow {
        font-family: var(--font-mono);
        font-size: 0.82rem;
        color: var(--green);
        letter-spacing: 0.1em;
        margin-bottom: 1.2rem;
        animation: floatUp 0.7s ease both 0.1s;
      }
      .hero-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(2.8rem, 8vw, 5rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
        background: linear-gradient(
          135deg,
          var(--coral) 0%,
          var(--purple) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
        animation: floatUp 0.7s ease both 0.2s;
      }
      .hero-role {
        font-family: var(--font-mono);
        font-size: clamp(1rem, 3vw, 1.25rem);
        color: var(--text);
        margin-bottom: 2rem;
        min-height: 2em;
        display: flex;
        align-items: center;
        gap: 4px;
        animation: floatUp 0.7s ease both 0.35s;
      }
      .hero-bio {
        font-size: 1rem;
        color: var(--muted);
        max-width: 580px;
        line-height: 1.8;
        margin-bottom: 2.5rem;
        animation: floatUp 0.7s ease both 0.45s;
      }
      .hero-pills {
        animation: floatUp 0.7s ease both 0.55s;
      }
      .cursor {
        display: inline-block;
        width: 3px;
        height: 1em;
        background: var(--yellow);
        margin-left: 2px;
        vertical-align: middle;
        animation: blink 1s step-end infinite;
      }

      /* ── Pills ── */
      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border-radius: 999px;
        border: 2px solid var(--border);
        background: var(--card-bg);
        color: var(--muted);
        font-size: 0.82rem;
        font-family: var(--font-mono);
        transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .pill:hover {
        border-color: var(--coral);
        background: var(--coral);
        color: #fff;
        transform: translateY(-3px) scale(1.04);
        box-shadow: 0 8px 20px #ff6b6b44;
      }

      /* ── Section label ── */
      .section-label {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
      }
      .section-label-bar {
        display: block;
        width: 32px;
        height: 3px;
        border-radius: 2px;
      }
      .section-label-text {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      /* ── About cards ── */
      .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        margin-bottom: 1.5rem;
      }
      .about-card {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 16px;
        padding: 1.5rem;
        cursor: default;
        transition:
          border-color 0.25s,
          box-shadow 0.25s,
          transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        position: relative;
        overflow: hidden;
      }
      .about-card::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0;
        background: linear-gradient(135deg, var(--shimmer) 0%, transparent 60%);
        transition: opacity 0.3s;
      }
      .about-card:hover {
        transform: translateY(-6px);
      }
      .about-card:hover::after {
        opacity: 1;
      }
      .about-emoji {
        font-size: 2rem;
        margin-bottom: 0.75rem;
        display: inline-block;
        transition: transform 0.3s;
      }
      .about-card:hover .about-emoji {
        animation: bounceEmoji 0.5s ease;
      }
      .about-title {
        font-family: var(--font-display);
        font-weight: 700;
        margin-bottom: 0.4rem;
      }
      .about-text {
        font-size: 0.88rem;
        color: var(--muted);
        line-height: 1.65;
      }

      /* ── Project / Cert cards ── */
      .card {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 16px;
        padding: 1.5rem 1.75rem;
        margin-bottom: 1rem;
        cursor: default;
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* shimmer sweep on hover */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--shimmer),
          transparent
        );
        transition: none;
        pointer-events: none;
      }
      .card:hover::before {
        animation: shimmer 0.55s ease forwards;
      }
      .card:hover {
        transform: translateY(-6px) scale(1.01);
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.5rem;
        gap: 1rem;
      }
      .card-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.05rem;
      }
      .card-emoji {
        display: inline-block;
        margin-right: 6px;
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card:hover .card-emoji {
        transform: rotate(-10deg) scale(1.25);
      }
      .card-date {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .card-sub {
        font-size: 0.82rem;
        font-weight: 500;
        margin-bottom: 0.75rem;
      }
      .card-bullets {
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }
      .card-bullet {
        list-style: none;
        font-size: 0.88rem;
        color: var(--muted);
        padding-left: 0.75rem;
        border-left: 2px solid;
        transition:
          color 0.2s,
          border-color 0.2s,
          padding-left 0.2s;
      }
      .card:hover .card-bullet {
        padding-left: 1rem;
      }

      /* ── Education card ── */
      .edu-card {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 16px;
        padding: 2rem;
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.25s,
          box-shadow 0.25s,
          transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .edu-card:hover {
        transform: translateY(-5px);
      }
      .edu-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        border-radius: 2px 0 0 2px;
      }
      .edu-inner {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-start;
      }
      .edu-degree {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.1rem;
        margin-bottom: 0.3rem;
      }
      .edu-school {
        font-weight: 500;
        margin-bottom: 0.25rem;
      }
      .edu-loc {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .edu-badge {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        padding: 4px 12px;
        border-radius: 999px;
        display: inline-block;
        margin-bottom: 0.5rem;
      }
      .edu-cgpa {
        font-family: var(--font-mono);
        font-size: 0.82rem;
        color: var(--muted);
      }

      /* ── Skills ── */
      .skills-block {
        margin-bottom: 1.5rem;
      }
      .skills-block-label {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 0.65rem;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .tag {
        padding: 5px 14px;
        border-radius: 999px;
        border: 2px solid;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        cursor: default;
      }
      .tag:hover {
        transform: translateY(-4px) scale(1.08);
      }

      /* ── Contact ── */
      .contact-box {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 20px;
        padding: 3rem 2rem;
        text-align: center;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }
      .contact-box:hover {
        border-color: var(--coral);
        box-shadow: 0 12px 48px #ff6b6b22;
      }
      .contact-emoji {
        font-size: 3rem;
        margin-bottom: 1rem;
        display: inline-block;
        transition: transform 0.3s;
      }
      .contact-box:hover .contact-emoji {
        animation: bounceEmoji 0.5s ease;
      }
      .contact-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.8rem;
        margin-bottom: 0.75rem;
      }
      .contact-text {
        color: var(--muted);
        margin-bottom: 2rem;
      }

      /* ── Bio box ── */
      .bio-box {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 16px;
        padding: 1.5rem 1.75rem;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }
      .bio-box:hover {
        border-color: var(--purple);
        box-shadow: 0 8px 28px #c77dff22;
      }

      /* ── Footer ── */
      footer {
        padding: 2rem 0;
        text-align: center;
      }
      footer p {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--muted);
      }

      @media (max-width: 600px) {
        .about-grid {
          grid-template-columns: 1fr;
        }
        .nav-links a[data-section] {
          display: none;
        }
        .hero-name {
          font-size: 2.5rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
        .reveal,
        .stagger > * {
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </head>

      /* ── Hooks ── */
      function useTypewriter(words, speed = 80) {
        const [display, setDisplay] = useState("");
        const [wi, setWi] = useState(0);
        const [ci, setCi] = useState(0);
        const [del, setDel] = useState(false);
        useEffect(() => {
          const cur = words[wi];
          const delay = del ? 38 : ci === cur.length ? 1800 : speed;
          const t = setTimeout(() => {
            if (!del && ci < cur.length) {
              setDisplay(cur.slice(0, ci + 1));
              setCi((c) => c + 1);
            } else if (!del) {
              setDel(true);
            } else if (del && ci > 0) {
              setDisplay(cur.slice(0, ci - 1));
              setCi((c) => c - 1);
            } else {
              setDel(false);
              setWi((i) => (i + 1) % words.length);
            }
          }, delay);
          return () => clearTimeout(t);
        }, [ci, del, wi]);
        return display;
      }

      /* Scroll-reveal: adds .visible to element when it enters viewport */
      function useReveal(cls = "reveal", threshold = 0.12) {
        const ref = useRef(null);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const obs = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                el.classList.add("visible");
                obs.disconnect();
              }
            },
            { threshold },
          );
          obs.observe(el);
          return () => obs.disconnect();
        }, []);
        return ref;
      }

      /* ── Components ── */
      function Tag({ label, idx }) {
        const color = COLORS[idx % COLORS.length];
        const [h, setH] = useState(false);
        return (
          <span
            className="tag"
            onMouseEnter={() => setH(true)}
            onMouseLeave={() => setH(false)}
            style={{
              borderColor: color,
              color: h ? "var(--bg)" : color,
              background: h ? color : "transparent",
            }}
          >
            {label}
          </span>
        );
      }

      function Card({ item, delay = 0 }) {
        const ref = useRef(null);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const obs = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                setTimeout(() => {
                  el.style.opacity = "1";
                  el.style.transform = "translateY(0) scale(1)";
                }, delay);
                obs.disconnect();
              }
            },
            { threshold: 0.1 },
          );
          obs.observe(el);
          return () => obs.disconnect();
        }, [delay]);

        return (
          <div
            ref={ref}
            className="card"
            style={{
              opacity: 0,
              transform: "translateY(32px) scale(0.97)",
              transition:
                "opacity 0.55s cubic-bezier(.22,1,.36,1), transform 0.55s cubic-bezier(.22,1,.36,1), border-color 0.25s, box-shadow 0.25s",
            }}
            onMouseEnter={(e) => {
              e.currentTarget.style.borderColor = item.color;
              e.currentTarget.style.boxShadow = `0 12px 40px color-mix(in srgb, ${item.color} 30%, transparent)`;
            }}
            onMouseLeave={(e) => {
              e.currentTarget.style.borderColor = "var(--border)";
              e.currentTarget.style.boxShadow = "none";
            }}
          >
            <div className="card-header">
              <span className="card-title">
                <span className="card-emoji">{item.emoji}</span>
                {item.title}
              </span>
              <span className="card-date">{item.date}</span>
            </div>
            <p className="card-sub" style={{ color: item.color }}>
              {item.tag || item.issuer}
            </p>
            <ul className="card-bullets">
              {item.bullets.map((b, i) => (
                <li
                  key={i}
                  className="card-bullet"
                  style={{ borderColor: item.color + "66" }}
                >
                  {b}
                </li>
              ))}
            </ul>
          </div>
        );
      }

      function Pill({ href, icon, label }) {
        return (
          <a href={href} className="pill">
            {icon} {label}
          </a>
        );
      }

      function SLabel({ color, children }) {
