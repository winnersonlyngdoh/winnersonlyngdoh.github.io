<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>For Pookie ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <div id="landing">
      <h1>Hi Pookie ❤️</h1>

      <p>Press the button below.</p>

      <button id="startBtn">Open My Heart</button>

      <div id="loader">
        <h2>Love Meter</h2>

        <div class="bar">
          <div class="fill"></div>
        </div>

        <div id="percent">0%</div>

        <div id="message"></div>
      </div>
    </div>

    <div id="questionScreen">
      <h1>Do You Love Me?</h1>

      <div id="buttonArea">
        <button id="yesBtn">Yes ❤️</button>

        <button id="noBtn">No 😶</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
