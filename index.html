<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>For My Ever Pookie ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <canvas id="canvas"></canvas>

    <!-- ========================= -->
    <!-- Landing Screen -->
    <!-- ========================= -->

    <section id="landing" class="screen">
      <h1>For My Ever Pookie ❤️</h1>

      <p>Press the button below.</p>

      <button id="startBtn">Open My Heart</button>

      <div id="loader">
        <h2>Love Meter</h2>

        <div class="bar">
          <div class="fill"></div>
        </div>

        <div id="percent">0%</div>

        <div id="message"></div>
      </div>
    </section>

    <!-- ========================= -->
    <!-- Love Question -->
    <!-- ========================= -->

    <section id="questionScreen" class="screen">
      <h1>Do You Love Me?</h1>

      <div id="buttonArea">
        <button id="yesBtn">Yes ❤️</button>

        <button id="noBtn">No 😶</button>
      </div>
    </section>

    <!-- ========================= -->
    <!-- Fortune Screen -->
    <!-- ========================= -->

    <section id="fortuneScreen" class="screen">
      <h1>✨ Daily Fortune ✨</h1>

      <button id="fortuneBtn">Reveal Today's Fortune</button>

      <div id="fortuneCard">
        <p id="fortuneText"></p>
      </div>
    </section>

    <section id="scratchScreen" class="screen">
      <h1>Scratch Card ❤️</h1>

      <p>Scratch to reveal today's surprise.</p>

      <div class="scratchContainer">
        <div id="hiddenMessage">
          I LOVE YOU SO MUCH POOKIE ❤️ Stay Tuned for our 3 year Anniversary
        </div>

        <canvas id="scratchCanvas"></canvas>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
